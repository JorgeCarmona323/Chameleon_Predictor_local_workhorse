name: chameleon
channels:
  - conda-forge
dependencies:
  - python=3.11
  # ── Core chemistry ────────────────────────────────────────────────────────
  - rdkit>=2023.9
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  # ── Conformer sampling (Tier-2 CREST pipeline) ───────────────────────────
  - crest>=3.0          # iMTD-GC conformer sampling
  - xtb>=6.6            # GFN2-xTB semi-empirical engine + ALPB solvation
  # ── Visualization ─────────────────────────────────────────────────────────
  - matplotlib>=3.7
  - seaborn>=0.12
  # ── Chemical space / clustering ───────────────────────────────────────────
  - umap-learn>=0.5.6
  - hdbscan>=0.8.33
  # ── ML models (feature benchmark) ────────────────────────────────────────
  - lightgbm>=4.0
  # ── Utilities ─────────────────────────────────────────────────────────────
  - jupyter
  - ipykernel
  - ipywidgets
  - tqdm
  - joblib
  - pip
  - pip:
      # Fingerprints
      - mhfp                # MAPC / MinHashed Atom-Pair fingerprint (chirality-aware)
      # ML
      - tabpfn              # TabPFN — best model for small tabular datasets (PROTAC-TS)
      # Descriptors
      - mordredcommunity    # 2D + 3D molecular descriptors (maintained fork of mordred)
      # Graph clustering (UMAP kNN → Leiden communities)
      - leidenalg
      - igraph
      # Document export
      - python-docx
      - python-pptx
      # Notebook utilities
      - nbformat
      - nbconvert
