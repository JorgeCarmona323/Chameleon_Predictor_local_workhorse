name: chem269_cycpep
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Core chemistry
  - rdkit>=2023.9
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12
  # Dimensionality reduction / clustering
  - umap-learn>=0.5.6
  - hdbscan>=0.8.33
  # Jupyter
  - jupyter
  - ipykernel
  - ipywidgets
  - tqdm
  # Parallelism
  - joblib
  - pip
  - pip:
      # Graph clustering for UMAP kNN graph
      - leidenalg
      - igraph
      # Mordred 3D descriptors (WHIM, autocorrelation)
      - mordred
      # Notebook conversion
      - nbformat
      - nbconvert
