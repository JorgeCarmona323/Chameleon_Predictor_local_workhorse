name: chameleon
channels:
  - conda-forge
dependencies:
  - python=3.11
  # ── Core chemistry ────────────────────────────────────────────────────────
  - rdkit>=2023.9
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  # ── Conformer sampling (Tier-2 CREST pipeline) ───────────────────────────
  # NOTE: crest>=3.0 listed here for fresh installs. On the SDSU GPU cluster
  # crest=2.12 was required — v3.x caused reproducible crashes during iMTD-GC
  # runs (April 2026). A separate env 'chameleon_crest212' was created on the
  # cluster with crest=2.12 + xtb=6.7.1 as the working production environment.
  # If you encounter crashes with v3.x, pin to: crest=2.12
  - crest>=3.0          # iMTD-GC conformer sampling
  - xtb>=6.7            # GFN2-xTB semi-empirical engine + ALPB solvation (6.7.1 confirmed)
  - dftd4               # DFT-D4 dispersion corrections (xTB dependency)
  - simple-dftd3        # DFT-D3 dispersion corrections (xTB dependency)
  - tblite              # tight-binding library (xTB dependency)
  # ── Visualization ─────────────────────────────────────────────────────────
  - matplotlib>=3.7
  - seaborn>=0.12
  # ── Chemical space / clustering ───────────────────────────────────────────
  - umap-learn>=0.5.6
  - hdbscan>=0.8.33
  # ── ML models (feature benchmark) ────────────────────────────────────────
  - lightgbm>=4.0
  # ── Utilities ─────────────────────────────────────────────────────────────
  - jupyter
  - ipykernel
  - ipywidgets
  - tqdm
  - joblib
  - pip
  - pip:
      # Fingerprints
      - mhfp                # MAPC / MinHashed Atom-Pair fingerprint (chirality-aware)
      # ML
      - tabpfn              # TabPFN — best model for small tabular datasets (PROTAC-TS)
      # Descriptors
      - mordredcommunity    # 2D + 3D molecular descriptors (maintained fork of mordred)
      # Graph clustering (UMAP kNN → Leiden communities)
      - leidenalg
      - igraph
      # Document export
      - python-docx
      - python-pptx
      # Notebook utilities
      - nbformat
      - nbconvert
